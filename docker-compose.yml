services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_echo_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && (psql -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'glitchtip'\" | grep -q 1 || psql -U postgres -c \"CREATE DATABASE glitchtip\")"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: ./bin/rails server -b 0.0.0.0
  #   environment:
  #     RAILS_ENV: development
