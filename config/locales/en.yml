    privacy:
      title: Privacy Policy & Security Promise
      last_updated: Last updated August 2026
      subtitle: Your future letters are private and sacred. We encrypt your content, never sell your data, and run zero advertisements.
      sections:
        intro:
          title: Our Commitment to Your Privacy
          description: TimeEcho ("we", "us", or "our") exists to protect your personal evolution and private thoughts. This Privacy Policy outlines how we safeguard your information, handle data encryption, and ensure your time capsules remain private.
        collect:
          title: What Information We Collect
          description: "We collect only what is essential to store and deliver your time capsules securely:"
          item_email: Your email address (used strictly for passwordless magic-link sign-ins and letter delivery)
          item_letters: Encrypted letter content and titles (protected with zero-knowledge encryption at rest)
          item_predictions: Future predictions and retrospective reflections you choose to write
          item_emotional: Emotional snapshot ratings (happiness, anxiety, and motivation levels)
          item_preferences: Interface settings (color theme, language, and notification choices)
          item_technical: Essential technical logs necessary for account security and service performance
        how_use:
          title: How We Use Your Information
          description: "We use your data solely to fulfill your time capsule experience:"
          item_accounts: Authenticate your account via single-use magic links
          item_store: Safely store your encrypted letters until your chosen delivery date
          item_deliver: Send your unsealed capsules to your verified email address on schedule
          item_communicate: Send critical account confirmations and delivery notifications
          item_improve: Maintain security, optimize page load speed, and enhance reliability
          item_security: Block automated abuse, prevent spam, and protect user data
        encryption:
          title: End-to-End Privacy & Encryption
          description: Letter titles and personal thoughts are encrypted before being stored. Nobody—not even our team—can read your words while your letter remains sealed in the vault.
        retention:
          title: Data Retention & Instant Deletion
          description: We retain your time capsules for as long as your account remains active. If you choose to delete your account in Settings, all associated letters, emotional snapshots, predictions, and analytics events are permanently and irreversibly purged from our database.
        third_parties:
          title: Trusted Infrastructure Partners
          description: "We work with trusted industry providers to process and deliver your capsules:"
          item_email: Resend API for transactional email delivery
          item_hosting: Hardened cloud infrastructure with isolated, encrypted databases
        rights:
          title: Your Data Rights & Control
          description: "You retain total ownership of your words. You have the right to:"
          item_access: Inspect and export your letter timeline at any time
          item_delete: Delete individual letters or purge your entire account in one click
          item_questions: Reach out to our team with privacy or technical data inquiries
        changes:
          title: Policy Updates
          description: If we make material updates to this Privacy Policy, we will post the changes here and notify active users via email.
        contact:
          title: Contact & Support
          description: "Have questions about how your letters are stored or encrypted? Reach out to our team directly at:"
    terms:
      title: Terms of Service
      last_updated: Last updated August 2026
      subtitle: Clear, human-readable terms outlining service commitments, letter scheduling integrity, and data ownership.
      sections:
        acceptance:
          title: Agreement to Terms
          description: By creating a capsule or using TimeEcho, you agree to these Terms of Service. If you do not agree, please do not access or use the platform.
        about:
          title: About TimeEcho
          description: TimeEcho is a digital time capsule platform where you can write letters to your future self, record emotional baseline snapshots, make life predictions, and schedule delivery for future dates.
        accounts:
          title: Passwordless Account Access
          description: TimeEcho uses secure magic-link authentication sent directly to your email inbox. You are responsible for keeping your email account secure.
        creating:
          title: Writing and Scheduling Capsules
          description: You can schedule letters to unlock on any future date. You are responsible for ensuring the recipient email address is valid and that your content complies with applicable laws.
        delivery:
          title: Scheduled Delivery Commitment
          description: TimeEcho processes scheduled capsules daily and sends them on or near your requested local unlock date using transactional mailers.
          disclaimer: While we make every technical effort to ensure prompt delivery, delivery dates depend on email provider acceptance, network availability, and spam filter settings.
        responsibilities:
          title: User Conduct
          description: You are responsible for maintaining account confidentiality and using TimeEcho respectfully.
        content:
          title: You Own 100% of Your Content
          description: You retain full ownership of all letters, predictions, and reflections you create on TimeEcho. You grant us a limited license solely to store, encrypt, and deliver your content as requested.
          license: This limited license permits us to hold your encrypted letters until their scheduled release date and transmit them to your email address upon unlock.
        prohibited:
          title: Prohibited Activities
          description: "To maintain platform safety, you agree not to use TimeEcho to:"
          item_spam: Send unsolicited emails or spam
          item_harassment: Harass, intimidate, or harm others
          item_threats: Issue threats of violence or illegal action
          item_fraud: Engage in deceptive, fraudulent, or malicious practices
          item_impersonation: Impersonate other individuals or entities
          item_illegal: Violate local or international laws
          item_malware: Distribute viruses, trojans, or harmful code
          item_abuse: Abuse infrastructure, perform denial-of-service, or scrape system data
          item_unauthorized: Attempt unauthorized database or server access
          item_infringement: Infringe upon third-party copyrights or intellectual property
        recipient:
          title: Recipient Email Consent
          description: When scheduling a capsule to a recipient email address, you confirm that you have permission to send messages to that address.
        intellectual:
          title: Platform Intellectual Property
          description: TimeEcho software, branding, UI components, and logos are protected intellectual property. Your personal letters remain entirely yours.
        availability:
          title: Service Availability
          description: We strive for 99.9% uptime, but access may occasionally be interrupted for scheduled maintenance, system updates, or emergency server repairs.
        termination:
          title: Account Cancellation
          description: You may delete your account at any time via Settings. We reserve the right to suspend accounts that violate these prohibited conduct rules.
        liability:
          title: Limitation of Liability
          description: TimeEcho is provided "as is". To the maximum extent permitted by law, TimeEcho shall not be liable for indirect or consequential damages arising from service usage or delivery delays.
        changes:
          title: Updates to Terms
          description: We may update these Terms from time to time. Continued use of TimeEcho after updates constitutes acceptance of the new terms.
        contact:
          title: Contact Us
          description: "For questions regarding these Terms, contact our team directly at:"
    about:
      title: Bridge who you are today with who you become tomorrow.
      subtitle: TimeEcho is a secure digital time capsule platform. Write deeply private letters, track your emotional baseline, make bold life predictions, and unlock them years later to compare outcomes.
      sections:
        what_is:
          title: Why Write to Your Future Self?
          description: In a fast-moving world, it’s easy to forget how much you’ve grown, what you cared about, or what you predicted for your life. TimeEcho lets you capture your present reality — your hopes, fears, relationships, and emotional baseline — and lock them in a digital vault until your chosen future date.
        how_works:
          title: How TimeEcho Works
          step_write_title: 1. Write & Capture
          step_write_desc: Pour your thoughts into a private letter. Capture your happiness, anxiety, and motivation levels, and make predictions about your future.
          step_seal_title: 2. Seal & Schedule
          step_seal_desc: Pick your delivery date and timezone. Your letter is securely encrypted and locked in your private vault until that day arrives.
          step_wait_title: 3. Live & Evolve
          step_wait_desc: Focus on your life. As months or years pass, your memories stay safe while you grow and reach new milestones.
          step_receive_title: 4. Open & Reflect
          step_receive_desc: When your date arrives, your letter unlocks in your inbox. Read your past words, check your predictions, and see how much you’ve grown.
        why_exists:
          title: Built for Honest Self-Conversation
          description: Social media forces us to perform for others. TimeEcho is designed for the opposite — a quiet, distraction-free space to be completely honest with yourself. No public feeds, no vanity metrics, no ads. Just a direct link between past you and future you.
        philosophy:
          title: Our Privacy Philosophy
          description: Your memories belong to you. We never sell user data, track you with advertising cookies, or analyze your letter contents. When you delete your account, your data is permanently purged from our database forever.
        contact:
          title: Contact & Creators
          description: "Have questions, feedback, or need assistance with TimeEcho? Reach out to our team directly:"
