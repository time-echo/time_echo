  brand: TimeEcho
  slogan: Una cápsula del tiempo digital para el alma.
  footer_copy: Enviado con esperanza, recibido con nostalgia.
  pages:
    footer:
      about: Acerca de
      privacy: Privacidad
      terms: Términos
    privacy:
      title: Política de Privacidad y Compromiso de Seguridad
      last_updated: "Última actualización: agosto de 2026"
      subtitle: Tus cartas del futuro son privadas y sagradas. Ciframos tu contenido, nunca vendemos tus datos y no mostramos publicidad.
      sections:
        intro:
          title: Nuestro Compromiso con tu Privacidad
          description: TimeEcho ("nosotros", "nuestro") existe para proteger tu evolución personal y tus pensamientos. Esta Política de Privacidad describe cómo resguardamos tu información, gestionamos el cifrado de datos y aseguramos que tus cápsulas permanezcan privadas.
        collect:
          title: Información que Recopilamos
          description: "Recopilamos únicamente lo esencial para almacenar y entregar tus cápsulas de forma segura:"
          item_email: Tu correo electrónico (usado exclusivamente para inicio de sesión sin contraseña mediante enlaces mágicos y entrega de cartas)
          item_letters: Título y contenido cifrado de tus cartas (protegidos con cifrado seguro en reposo)
          item_predictions: Predicciones futuras y reflexiones retrospectivas que decidas escribir
          item_emotional: Evaluaciones de estado emocional (niveles de felicidad, ansiedad y motivación)
          item_preferences: Preferencias de interfaz (tema de color, idioma y opciones de notificación)
          item_technical: Registros técnicos esenciales para la seguridad de la cuenta y el rendimiento del servicio
        how_use:
          title: Cómo Utilizamos tu Información
          description: "Utilizamos tus datos únicamente para hacer posible tu experiencia en la cápsula del tiempo:"
          item_accounts: Autenticar tu cuenta mediante enlaces mágicos de un solo uso
          item_store: Almacenar de forma segura tus cartas cifradas hasta su fecha de entrega programada
          item_deliver: Enviar tus cápsulas desbloqueadas a tu correo verificado según el calendario
          item_communicate: Enviar confirmaciones críticas de cuenta y notificaciones de entrega
          item_improve: Mantener la seguridad, optimizar la velocidad y mejorar la confiabilidad del servicio
          item_security: Bloquear abusos automatizados, prevenir spam y proteger los datos del usuario
        encryption:
          title: Privacidad y Cifrado de Alto Nivel
          description: Los títulos y contenidos de tus cartas se cifran antes de guardarse en nuestra base de datos. Nadie, ni siquiera nuestro equipo, puede leer tus palabras mientras la carta permanezca sellada en la bóveda.
        retention:
          title: Retención de Datos y Eliminación Instantánea
          description: Conservamos tus cápsulas del tiempo mientras tu cuenta permanezca activa. Si decides eliminar tu cuenta en Configuración, todas tus cartas, estados emocionales, predicciones y eventos analíticos asociados se borran de manera permanente e irreversible de nuestra base de datos.
        third_parties:
          title: Aliados de Infraestructura Confiables
          description: "Trabajamos con proveedores líderes de la industria para procesar y entregar tus cápsulas:"
          item_email: Resend API para la entrega transaccional de correos electrónicos
          item_hosting: Infraestructura en la nube de alta seguridad con bases de datos aisladas y cifradas
        rights:
          title: Tus Derechos y Control sobre tus Datos
          description: "Mantienes la propiedad total de tus palabras. Tienes derecho a:"
          item_access: Inspeccionar y exportar la cronología de tus cartas en cualquier momento
          item_delete: Eliminar cartas individuales o borrar tu cuenta completa en un solo clic
          item_questions: Contactar a nuestro equipo ante cualquier duda técnica o de privacidad
        changes:
          title: Actualizaciones de la Política
          description: Si realizamos cambios significativos en esta Política de Privacidad, los publicaremos aquí y notificaremos a los usuarios activos vía correo electrónico.
        contact:
          title: Contacto y Soporte
          description: "¿Tienes preguntas sobre cómo se almacenan o cifran tus cartas? Contáctanos directamente a:"
    terms:
      title: Términos de Servicio
      last_updated: "Última actualización: agosto de 2026"
      subtitle: Términos claros y humanos que definen nuestros compromisos de servicio, integridad en la entrega y propiedad de tus datos.
      sections:
        acceptance:
          title: Aceptación de los Términos
          description: Al crear una cápsula o utilizar TimeEcho, aceptas estos Términos de Servicio. Si no estás de acuerdo, por favor no uses la plataforma.
        about:
          title: Acerca de TimeEcho
          description: TimeEcho es una plataforma de cápsulas del tiempo digitales que te permite escribir cartas a tu yo futuro, registrar evaluaciones emocionales, hacer predicciones de vida y programar entregas futuras.
        accounts:
          title: Acceso a Cuenta Sin Contraseña
          description: TimeEcho utiliza autenticación segura mediante enlaces mágicos enviados directamente a tu bandeja de entrada. Eres responsable de mantener la seguridad de tu correo electrónico.
        creating:
          title: Escritura y Programación de Cápsulas
          description: Puedes programar cartas para abrirse en cualquier fecha futura. Eres responsable de asegurar que las direcciones de correo sean válidas y que el contenido cumpla con las leyes aplicables.
        delivery:
          title: Compromiso de Entrega Programada
          description: TimeEcho procesa las cápsulas programadas diariamente y las envía en o cerca de tu fecha de desbloqueo local mediante correos transaccionales.
          disclaimer: Aunque aplicamos los máximos esfuerzos técnicos para garantizar entregas puntuales, los horarios exactos dependen de los proveedores de correo, disponibilidad de red y filtros de spam.
        responsibilities:
          title: Conducta del Usuario
          description: Eres responsable de mantener la confidencialidad de tu cuenta y de utilizar TimeEcho de manera respetuosa.
        content:
          title: Eres Dueño del 100% de tu Contenido
          description: Conservas la propiedad absoluta de todas las cartas, predicciones y reflexiones que creas en TimeEcho. Nos otorgas una licencia limitada únicamente para almacenar, cifrar y entregar tu contenido según lo solicites.
          license: Esta licencia limitada nos permite guardar tus cartas cifradas hasta su fecha de apertura programada y transmitirlas a tu correo al desbloquearse.
        prohibited:
          title: Actividades Prohibidas
          description: "Para mantener la seguridad de la plataforma, aceptas no utilizar TimeEcho para:"
          item_spam: Enviar correos no solicitados o spam
          item_harassment: Acosar, intimidar o dañar a otros
          item_threats: Realizar amenazas de violencia o acciones ilegales
          item_fraud: Participar en prácticas engañosas, fraudulentas o maliciosas
          item_impersonation: Suplantar la identidad de otras personas o entidades
          item_illegal: Violar leyes locales o internacionales
          item_malware: Distribuir virus, troyanos o código dañino
          item_abuse: Abusar de la infraestructura, realizar ataques de denegación de servicio o extraer datos del sistema
          item_unauthorized: Intentar accesos no autorizados a servidores o bases de datos
          item_infringement: Infringir derechos de autor o propiedad intelectual de terceros
        recipient:
          title: Consentimiento del Destinatario
          description: Al programar una cápsula para una dirección de correo de un tercero, confirmas que tienes permiso para enviar mensajes a dicha dirección.
        intellectual:
          title: Propiedad Intelectual de la Plataforma
          description: El software, diseño, componentes de interfaz y marcas de TimeEcho son propiedad intelectual protegida. Tus cartas personales siguen siendo totalmente tuyas.
        availability:
          title: Disponibilidad del Servicio
          description: Nos esforzamos por mantener una disponibilidad del 99.9%, pero el acceso puede interrumpirse ocasionalmente por mantenimiento programado o reparaciones de emergencia.
        termination:
          title: Cancelación de Cuenta
          description: Puedes eliminar tu cuenta en cualquier momento desde Configuración. Nos reservamos el derecho de suspender cuentas que violen estas reglas de conducta.
        liability:
          title: Limitación de Responsabilidad
          description: TimeEcho se proporciona "tal cual". En la máxima medida permitida por la ley, TimeEcho no será responsable por daños indirectos o consecuentes derivados del uso del servicio o retrasos de entrega.
        changes:
          title: Actualizaciones de los Términos
          description: Podemos actualizar estos Términos periódicamente. El uso continuado de TimeEcho tras las actualizaciones constituye la aceptación de los nuevos términos.
        contact:
          title: Contacto
          description: "Para preguntas sobre estos Términos, puedes contactar a nuestro equipo directamente a:"
    about:
      title: Conecta a quien eres hoy con la persona en la que te convertirás mañana.
      subtitle: TimeEcho es una plataforma de cápsulas del tiempo digitales segura. Escribe cartas a tu yo del futuro, registra tu estado emocional, realiza predicciones de vida y desbloquéalas años después para comparar los resultados.
      sections:
        what_is:
          title: ¿Por qué escribirle a tu yo del futuro?
          description: En un mundo acelerado, es fácil olvidar cuánto has crecido, qué te preocupaba o qué soñabas para tu vida. TimeEcho te permite capturar tu realidad actual (tus esperanzas, miedos, relaciones y estado emocional) y guardarla en una bóveda digital hasta la fecha futura que elijas.
        how_works:
          title: Cómo Funciona TimeEcho
          step_write_title: 1. Escribe y Registra
          step_write_desc: Vierte tus pensamientos en una carta privada. Evalúa tu felicidad, ansiedad y motivación, y haz predicciones sobre tu futuro.
          step_seal_title: 2. Sella y Programa
          step_seal_desc: Elige tu fecha de entrega y zona horaria. Tu carta se cifra de forma segura y queda guardada en tu bóveda privada hasta ese momento.
          step_wait_title: 3. Vive y Evoluciona
          step_wait_desc: Concéntrate en tu vida. A medida que pasan los meses o años, tus palabras permanecen protegidas mientras creces y alcanzas nuevas metas.
          step_receive_title: 4. Abre y Reflexiona
          step_receive_desc: En la fecha elegida, tu carta llega a tu correo. Lee tus palabras pasadas, revisa tus predicciones y descubre cuánto has crecido.
        why_exists:
          title: Diseñado para una Conversación Honesta Contigo Mismo
          description: "Las redes sociales nos obligan a actuar para otros. TimeEcho está diseñado para lo opuesto: un espacio tranquilo y libre de distracciones para ser completamente honesto contigo mismo. Sin muros públicos, sin métricas de vanidad, sin anuncios. Solo un puente directo entre tu yo pasado y tu yo futuro."
        philosophy:
          title: Nuestra Filosofía
          description: Tus palabras importan. Tus memorias merecen ser preservadas. TimeEcho está diseñada con privacidad y simplicidad en su corazón—un rincón tranquilo de internet donde puedes ser honesto contigo mismo, sin algoritmos ni anuncios.
        contact:
          title: Contacto y Creadores
          description: "¿Tienes preguntas, comentarios o necesitas asistencia con TimeEcho? Escríbenos directamente a los creadores:"
